<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <link rel="stylesheet" href="styles.css">
    <title>Upcoming Meets</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="https://kit.fontawesome.com/58437b04cc.js" crossorigin="anonymous"></script>
</head>
<ul id="menu">
</ul>
<script src="pages.js"></script>

<body>
    <img class="bannerphoto" src="PhotoFinishPro.png" alt="PhotoFinishPro Timing logo">

    <main class="page">
        <h1>Upcoming Meets:</h1>
        <div id="upcoming_meets" class="products" aria-live="polite">
            <p class="meets-message">Loading meets...</p>
        </div>
        <noscript>
            <p>Please turn on JavaScript to see our meet schedule, or email <a href="mailto:PhotoFinishProTiming@gmail.com">PhotoFinishProTiming@gmail.com</a>.</p>
        </noscript>

        <details id="past_wrap" class="past-meets" hidden>
            <summary>Past meets</summary>
            <div id="past_meets" class="products"></div>
        </details>

        <h1>Book a Meet:</h1>
        <p>Now booking meets for the 2027 Track &amp; Field season. To book a meet, contact us at <a href="mailto:PhotoFinishProTiming@gmail.com">PhotoFinishProTiming@gmail.com</a> or go to the <a href="pricing.html">Booking &amp; Pricing page</a>.</p>
    </main>

    <footer class="site-footer">
      <nav class="social" aria-label="Social and contact links">
        <a href="https://www.instagram.com/photofinishpro_timing/"
           target="_blank" rel="noopener noreferrer"
           aria-label="PhotoFinishPro Timing on Instagram">
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="mailto:PhotoFinishProTiming@gmail.com"
           aria-label="Email PhotoFinishPro Timing">
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        </a>
        <a href="https://www.youtube.com/@PhotoFinishProTiming"
           target="_blank" rel="noopener noreferrer"
           aria-label="PhotoFinishPro Timing on YouTube">
          <i class="fa-brands fa-youtube" aria-hidden="true"></i>
        </a>
      </nav>
      <p>© 2026 PhotoFinishPro Timing. All rights reserved.</p>
    </footer>

    <script>
        // Meets come from meets.json. Upcoming meets show as cards; meets whose date has passed move to "Past meets".
        (function () {
            var upcomingEl = document.getElementById("upcoming_meets");
            var pastWrap = document.getElementById("past_wrap");
            var pastEl = document.getElementById("past_meets");

            // "2026-07-23" -> local date (avoids time zone shifting the day)
            function parseDate(str) {
                var p = str.split("-");
                return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            }

            function el(tag, className, text) {
                var node = document.createElement(tag);
                if (className) node.className = className;
                if (text) node.textContent = text;
                return node;
            }

            function dateLabel(meet) {
                var start = parseDate(meet.date);
                if (meet.endDate) {
                    var end = parseDate(meet.endDate);
                    return start.toLocaleDateString("en-US", { month: "long", day: "numeric" }) + " \u2013 " +
                           end.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
                }
                return start.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
            }

            function buildCard(meet) {
                var card = el("article", "product");
                card.appendChild(el("h2", null, meet.name));

                var when = el("p");
                var time = document.createElement("time");
                time.dateTime = meet.date;
                time.textContent = dateLabel(meet);
                when.appendChild(time);
                if (meet.time) when.appendChild(document.createTextNode(" \u00b7 " + meet.time));
                card.appendChild(when);

                if (meet.location) {
                    var where = el("p");
                    where.appendChild(el("strong", null, "Location: "));
                    where.appendChild(document.createTextNode(meet.location));
                    card.appendChild(where);
                }

                if (meet.description) card.appendChild(el("p", null, meet.description));

                if (meet.links && meet.links.length) {
                    var links = el("p");
                    meet.links.forEach(function (link, i) {
                        if (i > 0) links.appendChild(document.createElement("br"));
                        var a = el("a", null, link.label);
                        a.href = link.url;
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                        links.appendChild(a);
                    });
                    card.appendChild(links);
                }
                return card;
            }

            function render(meets) {
                var today = new Date();
                today.setHours(0, 0, 0, 0);

                var upcoming = [];
                var past = [];
                meets.forEach(function (meet) {
                    if (!meet.name || !meet.date) {
                        console.warn("Skipping a meet with no name or date:", meet);
                        return;
                    }
                    var lastDay = parseDate(meet.endDate || meet.date);
                    (lastDay >= today ? upcoming : past).push(meet);
                });

                upcoming.sort(function (a, b) { return parseDate(a.date) - parseDate(b.date); });
                past.sort(function (a, b) { return parseDate(b.date) - parseDate(a.date); });

                upcomingEl.innerHTML = "";
                if (upcoming.length === 0) {
                    upcomingEl.appendChild(el("p", "meets-message", "No meets are scheduled right now. Check back soon, or book one below!"));
                }
                upcoming.forEach(function (meet) { upcomingEl.appendChild(buildCard(meet)); });

                if (past.length > 0) {
                    past.forEach(function (meet) { pastEl.appendChild(buildCard(meet)); });
                    pastWrap.hidden = false;
                }
            }

            fetch("meets.json")
                .then(function (response) {
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    return response.json();
                })
                .then(function (data) { render(data.meets || []); })
                .catch(function (error) {
                    console.error("Could not load meets.json:", error);
                    upcomingEl.innerHTML = "";
                    var msg = el("p", "meets-message", "We couldn't load the meet list. Please email ");
                    var mail = el("a", null, "PhotoFinishProTiming@gmail.com");
                    mail.href = "mailto:PhotoFinishProTiming@gmail.com";
                    msg.appendChild(mail);
                    msg.appendChild(document.createTextNode(" for upcoming meets."));
                    upcomingEl.appendChild(msg);
                });
        })();
    </script>
</body>
</html>
